<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyên Mục Đang Cập Nhật | CuaBien247</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-page: #ffffff;
            --bg-card: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            line-height: 1.6;
            font-size: 14.5px;
            padding: 24px 16px;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .update-box {
            max-width: 480px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.06);
        }

        .update-img {
            max-width: 260px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 0 auto 20px;
            display: block;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        .update-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .update-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .update-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #eff6ff;
        }
    </style>
</head>
<body>

    <div class="update-box">
        <img class="update-img" src="Data/Hinh_Anh/cap-nhat-web.jpg" alt="Chuyên mục đang được cập nhật">
        <span class="update-badge">🚧 Đang hoàn thiện nội dung</span>
        <h1 class="update-title">Chuyên mục này đang được cập nhật...</h1>
        <p class="update-desc">Tài liệu và bài viết cho chuyên mục này đang được biên tập và bổ sung. Bạn vui lòng quay lại sau nhé!</p>
        
        <div class="btn-group">
            <a href="javascript:history.back()" class="btn-secondary">← Quay lại</a>
            <a href="Frame1_Welcome.html" target="_self" class="btn-primary">🏠 Về Trang Chủ</a>
        </div>
    </div>

</body>
</html>
