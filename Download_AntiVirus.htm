    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-page: #ffffff;
            --bg-card: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            line-height: 1.5;
            font-size: 14.5px;
            padding: 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eff6ff;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .av-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .av-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.2s ease;
        }

        .av-card:hover {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            transform: translateY(-2px);
        }

        .av-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        /* Số thứ tự nổi bật */
        .av-rank {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14.5px;
            flex-shrink: 0;
        }

        .av-title {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .btn-more {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .btn-more:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .av-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .btn-more {
                width: 100%;
                justify-content: center;
            }
        }
