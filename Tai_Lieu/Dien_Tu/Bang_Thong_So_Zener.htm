<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Thông Số Diod Zener | CuaBien247</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-page: #ffffff;
            --bg-item: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            line-height: 1.5;
            font-size: 14.5px;
            padding: 20px;
        }

        /* Thanh tiêu đề và nút quay lại */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eff6ff;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Danh sách trang bảng tra cứu */
        .sheet-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .sheet-card {
            width: 100%;
            max-width: 820px;
            background: var(--bg-item);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .sheet-label {
            display: inline-block;
            background: #e2e8f0;
            color: var(--text-dark);
            font-size: 12px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .sheet-card img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .sheet-card { padding: 8px; }
            .page-title { font-size: 17px; }
        }
    </style>
</head>
