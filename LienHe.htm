<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - CuaBien247</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            padding: 24px;
            line-height: 1.6;
        }
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2563eb;
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13.5px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: #334155;
        }
        input, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .btn-submit {
            background: #2563eb;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h2>Liên hệ với CuaBien247</h2>
        <p class="subtitle">Mọi đóng góp, thắc mắc hoặc yêu cầu hỗ trợ tài liệu, xin vui lòng gửi tin nhắn cho chúng tôi.</p>
        
        <!-- Thay link action bằng mã form của bạn (hoặc dùng Formspree kết nối trực tiếp email tuanluongpham@gmail.com) -->
        <form action="https://formspree.io/f/xqpqaqba" method="POST">
            <div class="form-group">
                <label for="name">Họ và tên của bạn:</label>
                <input type="text" id="name" name="name" required placeholder="Nhập họ tên...">
            </div>

            <div class="form-group">
                <label for="email">Email của bạn (để chúng tôi phản hồi):</label>
                <input type="email" id="email" name="email" required placeholder="Nhập địa chỉ email...">
            </div>

            <div class="form-group">
                <label for="message">Nội dung tin nhắn:</label>
                <textarea id="message" name="message" required placeholder="Nhập nội dung cần trao đổi..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Gửi phản hồi về Email</button>
        </form>
    </div>

</body>
</html>
